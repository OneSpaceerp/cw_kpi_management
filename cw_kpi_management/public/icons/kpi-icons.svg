<!-- KPI module icons for the desk dock (soft) and the sidebar headers (duotone), drawn in the style of
     Frappe's and ERPNext's module-icons.svg. Loaded on every desk page through app_include_icons.

     Paint is inline and reads the same custom properties ERPNext's icons read (duotone-light and
     duotone-dark), so the icons render the same on desk versions that do not style the soft-icon
     classes. -->
<svg id="cw-kpi-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<!-- Performance: a score gauge -->
	<symbol viewBox="0 0 24 24" id="icon-kpi-gauge-duotone" stroke="none">
		<path d="M3.5 17a8.5 8.5 0 0 1 17 0" style="fill: none; stroke: var(--duotone-light, var(--ink-gray-3)); stroke-width: 4; stroke-linecap: round" />
		<path d="M12 8.5a8.5 8.5 0 0 1 8.5 8.5" style="fill: none; stroke: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6))); stroke-width: 4; stroke-linecap: round" />
		<path d="M12 16.6 15.6 11.4" style="fill: none; stroke: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6))); stroke-width: 2.2; stroke-linecap: round" />
		<circle cx="12" cy="16.6" r="2.3" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
	</symbol>
	<symbol viewBox="0 0 24 24" id="icon-kpi-gauge-soft" class="soft-icon">
		<path d="M3 17.5a9 9 0 0 1 18 0" class="soft-body" style="fill: currentColor; fill-opacity: 0.14; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round" />
		<path d="M3 17.5h18" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round" />
		<path d="M12 15.5 15.8 10" class="soft-accent-line" style="fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round" />
		<circle cx="12" cy="15.5" r="1.7" class="soft-accent" style="fill: currentColor; stroke: none" />
	</symbol>

	<!-- Payroll: a banknote with a coin -->
	<symbol viewBox="0 0 24 24" id="icon-kpi-payroll-duotone" stroke="none">
		<rect x="2" y="5" width="16.5" height="11" rx="1.6" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<circle cx="10.25" cy="10.5" r="2.6" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<circle cx="17" cy="16" r="5" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<circle cx="17" cy="16" r="2.3" style="fill: none; stroke: var(--duotone-light, var(--ink-gray-3)); stroke-width: 1.4" />
	</symbol>
	<symbol viewBox="0 0 24 24" id="icon-kpi-payroll-soft" class="soft-icon">
		<rect x="2.5" y="5" width="15.5" height="10.5" rx="1.8" class="soft-body" style="fill: currentColor; fill-opacity: 0.14; stroke: currentColor; stroke-width: 1.6" />
		<circle cx="10.25" cy="10.25" r="2.2" style="fill: none; stroke: currentColor; stroke-width: 1.6" />
		<circle cx="17.5" cy="16.5" r="4.2" class="soft-accent" style="fill: currentColor; stroke: none" />
	</symbol>

	<!-- Setup: sliders -->
	<symbol viewBox="0 0 24 24" id="icon-kpi-setup-duotone" stroke="none">
		<rect x="2.5" y="5.6" width="19" height="2.8" rx="1.4" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<rect x="2.5" y="10.6" width="19" height="2.8" rx="1.4" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<rect x="2.5" y="15.6" width="19" height="2.8" rx="1.4" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<circle cx="8.5" cy="7" r="2.8" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<circle cx="15.5" cy="12" r="2.8" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<circle cx="7" cy="17" r="2.8" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
	</symbol>
	<symbol viewBox="0 0 24 24" id="icon-kpi-setup-soft" class="soft-icon">
		<path d="M3 7h3.5m5 0H21M3 12h10m5 0h3M3 17h1.5m5 0H21" style="fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round" />
		<circle cx="9" cy="7" r="2.2" class="soft-body" style="fill: currentColor; fill-opacity: 0.14; stroke: currentColor; stroke-width: 1.6" />
		<circle cx="15.5" cy="12" r="2.2" class="soft-accent" style="fill: currentColor; stroke: currentColor; stroke-width: 1.6" />
		<circle cx="7" cy="17" r="2.2" class="soft-body" style="fill: currentColor; fill-opacity: 0.14; stroke: currentColor; stroke-width: 1.6" />
	</symbol>
</svg>
