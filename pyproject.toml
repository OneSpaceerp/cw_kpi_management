[project]
name = "cw_kpi_management"
authors = [
    { name = "Nest Software Development", email = "info@nsd-eg.com" },
    { name = "C-Water", email = "info@cw-eg.com" }
]
description = "C-Water Employee KPI Management & Calculation Engine for ERPNext v16"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
indent-width = 4
target-version = "py310"
